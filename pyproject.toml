[project]
# This repo is a Home Assistant custom integration delivered as
# ``custom_components/tuya_ble/``, not a pip-installable
# package. The ``[project]`` block here exists so uv recognises the
# directory as a managed project; ``[tool.uv] package = false`` keeps
# uv from trying to build/install it.
name = "ha-tuya-ble"
version = "0.0.0"
description = "Home Assistant integration for Tuya Bluetooth Low Energy devices"
requires-python = ">=3.14.2"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiousbwatcher==1.1.2",
    "bleak==3.0.2",
    "bluetooth-adapters==2.4.0",
    "dbus-fast==5.0.22",
    "habluetooth==6.26.5",
    "homeassistant==2026.8.0",
    "pre-commit==4.6.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.354",
    "serialx==1.8.2",
    "tuya-ble-sdk==0.1.1",
]
lint = [
    "ruff==0.16.1",
    "mypy==2.3.0",
]

# TEMPORARY: tuya-ble-sdk has not been published to PyPI yet, so the pin above
# is resolved from the sibling checkout. Delete this table the moment the SDK's
# first release lands — with it in place, a clone without that sibling cannot
# install the development environment.
[tool.uv.sources]
tuya-ble-sdk = { path = "../tuya-ble-sdk" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=custom_components/tuya_ble",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/tuya_ble"]
ignore_missing_imports = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# Ruff config mirrors Home Assistant core's pyproject.toml.
[tool.ruff]
target-version = "py314"

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "D203",    # no-blank-line-before-class (incompatible with formatter)
    "D212",    # multi-line-summary-first-line (incompatible with formatter)
    "COM812",  # incompatible with formatter
    "ISC001",  # incompatible with formatter
    "CPY001",  # copyright headers are not used in this project
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Submodules of the integration reach the parent package for the coordinator,
# entity base, constants and typed entry; a relative parent import is the only
# form that resolves under both mypy and the Home Assistant runtime, which
# loads `custom_components` as a namespace package.
"**/data/runtime.py" = ["TID252"]
"**/sensor/*.py" = ["TID252"]
"tests/**" = [
    "S101",     # assert is normal in pytest
    "S105",     # hardcoded-password-string is fine for fake test credentials
    "S106",     # hardcoded-password-func-arg is fine for fake test credentials
    "D",        # no docstrings required in tests
    "ANN",      # no type annotations required in tests
    "ARG001",   # fixtures are used implicitly by pytest
    "PLC0415",  # local imports inside fixtures are intentional
    "SLF001",   # testing private HA attrs and internal methods is intentional
    "PLR2004",  # magic numbers in test assertions are fine
    "S324",     # tests recompute the MD5 the Tuya protocol specifies
]
